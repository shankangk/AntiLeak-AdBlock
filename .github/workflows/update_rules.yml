name: Daily Auto-Update AntiLeak & AdBlock Rules

on:
  schedule:
    # 每天北京时间 09:15 自动运行 (UTC 01:15)，紧随上游 Johnshall 每日 08:00 构建后执行
    - cron: '15 1 * * *'
  workflow_dispatch: # 支持在 GitHub Web 界面手动一键触发

permissions:
  contents: write

# 防重复构建: 同一时间只跑一个每日构建, 新触发不取消正在跑的那个
concurrency:
  group: daily-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run Rule Builder
        run: |
          python3 scripts/build.py

      # 生成后自检 (不联网): build.py 内置自检已在上一步跑过,
      # 这里再单独跑一次 --check, 确保提交的 output/ 一定是通过自检的版本
      - name: Validate Outputs
        run: |
          python3 scripts/build.py --check

      # 轻量扫描: 输出与配置里不许出现明文 http:// 的规则/订阅/DoH 地址
      - name: Scan for Plaintext URLs
        run: |
          if grep -rIn --exclude-dir=.git -E 'http://[^ ]*(dns-query|raw\.githubusercontent|cdn\.jsdelivr)' output/ clash/ rules/ scripts/build.py; then
            echo "发现明文 http:// 规则/DoH 地址, 构建失败"
            exit 1
          fi
          echo "未发现明文 http:// 规则/DoH 地址"

      - name: Check for Changes
        id: git-check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          if git diff --quiet output/ docs/redirect.html; then
            echo "changed=0" >> $GITHUB_OUTPUT
            echo "无规则变更，跳过提交"
          else
            echo "changed=1" >> $GITHUB_OUTPUT
            echo "检测到规则更新"
          fi

      - name: Commit and Push Rules
        if: steps.git-check.outputs.changed == '1'
        run: |
          git add output/ docs/redirect.html
          git commit -m "Auto-update: Sync Johnshall AD rules & recompile AntiLeak conf [skip ci]"
          git push
