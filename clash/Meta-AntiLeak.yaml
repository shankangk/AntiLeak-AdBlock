# =================================================================
# Clash Meta (Mihomo) 防 DNS 泄露 + 广告拦截配置 (Android / 跨平台)
# 与 iOS 版 Mini-AntiLeak.conf 一一对应的移植版, 防护模型完全一致:
#  1. ipv6: false 全局关闭 IPv6 解析, 封堵运营商 IPv6 DNS 劫持/泄露
#     (对应 Shadowrocket: ipv6 = false / prefer-ipv6 = false)
#  2. DNS 使用 fake-ip 模式: 未直连的域名不做本地真实解析, 只发假 IP,
#     应用连接时把原始域名交给代理节点远端解析, 本地运营商零记录
#     (对应 Shadowrocket: FINAL,PROXY 远端解析)
#  3. respect-rules: true: DNS 查询本身也按分流规则走 —— 国内域名用
#     国内加密 DoH 直连解析, 国外域名用国外 DoH 并经代理发出。
#     国内直连路径没有因为防泄露而变慢: 国内域名 (geosite:cn,private
#     与 ChinaDomain / Apple 等规则命中的域名) 仍走国内 DoH 直连,
#     不经过代理、不走国外 DoH; 只有国外域名才走代理 DoH / 远端解析。
#     国外 DoH 与阿里 DoH 用 IP 字面量 (https://<IP>/dns-query), 腾讯
#     DoH 用 doh.pub 主机名 (119.29.29.29 裸 IP 不提供 DoH, 实测
#     服务端直接断开连接); 该主机名只由加密 DoT 解析, 因此不需要
#     先用明文 DNS 解析 DoH 主机名, bootstrap 泄露口被堵死, 国内
#     解析也少了一次主机名查询 (阿里那路)。
#     (对应 Shadowrocket: dns-direct-system = false +
#      dns-direct-fallback-proxy = true, 直连绝不走系统明文 DNS)
#  4. 所有 IP-CIDR / GEOIP 国内规则强制 no-resolve, 防止为匹配 IP
#     规则而对域名做预解析 (与 iOS 版同名机制)
#  5. TUN strict-route + dns-hijack 接管全部 53 端口查询与 DoT 853
#     端口, STUN 拦截封堵 WebRTC 泄露, UDP 443/8443 (QUIC) 拦截
#     强制走 TCP/TLS (对应 Shadowrocket 的「禁用 STUN」开关;
#     见 rules 第 0 节注释: 在 UDP 被限流的网络下强制 TCP/TLS
#     同时利于防泄露 (SNI 可嗅探) 与网速, 代价是 HTTP/3 不可用,
#     见 README「网络不通畅怎么办」)
#  6. 广告拦截与 iOS 版同源: Johnshall 每日规则 (由 scripts/build.py
#     自动拆成 domain + ipcidr 两类, 见 rule-providers) +
#     ACL4SSR BanAD/BanProgramAD + GEOSITE category-ads-all 三层 REJECT。
#     Johnshall 的 52,527 条域名规则用 behavior:domain (yaml payload),
#     128 条 IP 规则用 behavior:ipcidr (纯 CIDR 文本), 不再用
#     52,655 条 classical 文本逐条匹配。
#  7. 规则集拉取: 全部 rule-provider 均指定 proxy: PROXY, 且
#     ACL4SSR 10 个列表由 build.py 自托管到 output/clash/acl4ssr/,
#     不再让客户端在裸连状态下直连 raw.githubusercontent.com 拉规则。
#
# 【使用前必改一处】把下方 proxy-providers 中 MySubscribe 的 url
# 换成你自己的订阅链接 (机场订阅链接可直接填, 只取其中节点部分),
# 或删掉 proxy-providers / use 字段, 把节点手写进 proxies:。
# 适用于 Android: FlClash / Clash Meta for Android;
# 桌面端 Clash Verge / Mihomo Party 同样可用。
# =================================================================

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
# Android 客户端 (FlClash / CMFA) 通常会接管控制端口, 此项仅桌面端生效
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

# 域名嗅探: 应用绕开系统 DNS 直连 IP 时, 从 TLS SNI / HTTP Host 还原
# 域名重新按域名规则分流, 堵住「应用自带 DNS 解析」造成的泄露与绕行
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# TUN 接管 (Android 上即 VPN 模式): dns-hijack 劫持全部 DNS 查询,
# strict-route 阻止应用绕过 TUN 直连, 杜绝 DNS 与流量双通道泄露
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
    - tcp://any:853
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  # 局域网/保留地址不进 TUN (对应 Shadowrocket tun-excluded-routes)
  route-exclude-address:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 255.255.255.255/32

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 以下域名不用 fake-ip (局域网、授时、连通性检测, 对应 iOS 版
  # skip-proxy 中的 localhost / *.local / captive.apple.com)
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - time1.*.com
    - time2.*.com
    - time3.*.com
    - time4.*.com
    - time5.*.com
    - time6.*.com
    - time7.*.com
    - ntp.*.com
    - ntp1.*.com
    - ntp2.*.com
    - ntp3.*.com
    - ntp4.*.com
    - ntp5.*.com
    - ntp6.*.com
    - ntp7.*.com
    - "*.ntp.org.cn"
    - +.pool.ntp.org
    - +.stun.*.*
    - +.stun.*.*.*
    - connectivitycheck.gstatic.com
    - www.msftconnecttest.com
    - www.msftncsi.com
    - dns.msftncsi.com
  # bootstrap 专用, 只做 DoT 加密解析, 不处理普通查询。
  # 注意: default-nameserver 必须是 IP (Mihomo 要求), 这里用 DoT
  # (tls://) 而不用明文 IP。阿里与国外 DoH 用 IP 字面量, 腾讯
  # doh.pub 主机名由这里的 DoT 解析, 绝不走明文 DNS, bootstrap 只是兜底。
  default-nameserver:
    - tls://223.5.5.5
    - tls://119.29.29.29
  # 仅用于解析代理节点服务器域名 (阿里 IP 字面量 + 腾讯 doh.pub, 直连)
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 默认解析: 国外加密 DoH (IP 字面量), 且经 PROXY 策略组发出,
  # 运营商看不到查询。1.1.1.1 = Cloudflare, 8.8.8.8 = Google。
  nameserver:
    - https://1.1.1.1/dns-query#PROXY
    - https://8.8.8.8/dns-query#PROXY
  # 直连解析: 国内加密 DoH (直连, 不走代理)。
  # 223.5.5.5 = 阿里 AliDNS (IP 字面量 DoH, 实测可用); 第二路用
  # doh.pub 主机名 (腾讯 DoH): 119.29.29.29 裸 IP 不提供 DoH
  # (2026-11-24 实测: 服务端直接断开连接), 故不用 IP 字面量;
  # 该主机名只由 default-nameserver 的加密 DoT 解析, 绝不走明文 DNS。
  # 国内域名走这里, 延迟与改前 (主机名 DoH) 相同量级, 且少了
  # 一次 bootstrap 主机名查询, 实测见 README / 提交说明。
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

hosts:
  localhost: 127.0.0.1

# ============ 节点来源 (二选一) ============
# 本仓库不提供任何节点。把 url 换成你自己的订阅链接即可。
proxies: []

proxy-providers:
  MySubscribe:
    type: http
    # ↓↓↓ 必改: 替换为你自己的订阅链接 ↓↓↓
    url: "https://example.com/replace-with-your-subscription-url"
    interval: 86400
    path: ./proxy_providers/MySubscribe.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
      lazy: true

proxy-groups:
  # 主策略组, 名称与 iOS 版 FINAL,PROXY 对应 (DNS 的 #PROXY 也指向它)
  # 默认先走 AUTO (url-test 自动选延迟最低), AUTO 全挂时走
  # AUTO-FALLBACK (fallback 按顺序选第一个可用), 再走 DIRECT。
  # interval 从 300 改为 180 秒: 死节点更快被发现, 测速开销仍可接受
  # (每次只测 generate_204, 且 AUTO 的 lazy:false 只在切换时测)。
  - name: PROXY
    type: select
    use:
      - MySubscribe
    proxies:
      - AUTO
      - AUTO-FALLBACK
      - DIRECT
  - name: AUTO
    type: url-test
    use:
      - MySubscribe
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    lazy: false
  - name: AUTO-FALLBACK
    type: fallback
    use:
      - MySubscribe
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50

# GEO 数据自动更新 (GEOSITE / GEOIP 规则依赖)
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

rule-anchor:
  classical: &classical
    type: http
    interval: 86400
    behavior: classical
    format: text
    proxy: PROXY
  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: yaml
    proxy: PROXY
  ipcidr: &ipcidr
    type: http
    interval: 86400
    behavior: ipcidr
    format: text
    proxy: PROXY

rule-providers:
  # Johnshall 广告规则的 Clash 拆分版, 与 iOS 版同源同日自动构建。
  # domain 版是 yaml payload (+.domain 形式, 52,527 条),
  # ipcidr 版是纯 CIDR 文本 (128 条)。
  # 旧的 ad_johnshall_clash.list (classical, 52,655 条) 仍由
  # build.py 生成一版, 仅作过渡期兼容, 本模板不再引用它。
  JohnshallDomain:
    <<: *domain
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/ad_johnshall_domain.yaml"
    path: ./ruleset/ad_johnshall_domain.yaml
  JohnshallIP:
    <<: *ipcidr
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/ad_johnshall_ipcidr.list"
    path: ./ruleset/ad_johnshall_ipcidr.list
  # 以下与 iOS 版 Mini-AntiLeak.conf 引用的 ACL4SSR 规则集完全一致
  BanAD:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/BanAD.list"
    path: ./ruleset/BanAD.list
  BanProgramAD:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/BanProgramAD.list"
    path: ./ruleset/BanProgramAD.list
  LocalAreaNetwork:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/LocalAreaNetwork.list"
    path: ./ruleset/LocalAreaNetwork.list
  UnBan:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/UnBan.list"
    path: ./ruleset/UnBan.list
  GoogleCN:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/GoogleCN.list"
    path: ./ruleset/GoogleCN.list
  ChinaDomain:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/ChinaDomain.list"
    path: ./ruleset/ChinaDomain.list
  ChinaMedia:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/ChinaMedia.list"
    path: ./ruleset/ChinaMedia.list
  Apple:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/Apple.list"
    path: ./ruleset/Apple.list
  ChinaCompanyIp:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/ChinaCompanyIp.list"
    path: ./ruleset/ChinaCompanyIp.list
  ChinaIp:
    <<: *classical
    url: "https://raw.githubusercontent.com/shankangk/AntiLeak-AdBlock/main/output/clash/acl4ssr/ChinaIp.list"
    path: ./ruleset/ChinaIp.list

rules:
  # ---- 0. QUIC 拦截: UDP 443/8443 一律 REJECT, 强制走 TCP/TLS ----
  # 原因: QUIC (HTTP/3) 走 UDP, 会绕过 TLS SNI 嗅探与代理分流,
  # 且在 UDP 被限流的网络下常超时, 强制 TCP 后 SNI 可被嗅探还原、
  # 分流更准, 网速反而更稳。代价: HTTP/3 不可用, 部分 Google
  # 服务可能变慢, 见 README「网络不通畅怎么办」。
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,8443)),REJECT

  # ---- 0b. WebRTC 防泄露: 拦截 STUN/TURN 探测 (对应 iOS 版禁用 STUN) ----
  # 端口段经 Mihomo v1.19.33 实测接受 (3478-3481 / 19302-19309)。
  # 注意: Mihomo 没有合法的 DOMAIN-SUFFIX,stun.* 通配写法,
  # STUN 靠端口拦截覆盖全部 STUN 服务器 (与主机名无关),
  # 域名规则只保留已知的一个 Google STUN 主机。
  - AND,((NETWORK,udp),(DST-PORT,3478-3481)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,5349)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,5350)),REJECT
  - AND,((NETWORK,udp),(DST-PORT,19302-19309)),REJECT
  - DOMAIN-SUFFIX,stun.l.google.com,REJECT

  # ---- 1. 广告与追踪拦截 (与 iOS 版同源) ----
  # 顺序注意: 广告规则必须在国内 DIRECT 规则之前。既在广告名单
  # 又在 ChinaDomain 等国内名单里的域名, 结果必须是 REJECT,
  # 绝不能把 ChinaDomain/DIRECT 挪到广告前面。
  # IP 规则只有 128 条, 放域名规则前面, 匹配更快。
  - RULE-SET,JohnshallIP,REJECT
  - RULE-SET,JohnshallDomain,REJECT
  - RULE-SET,BanAD,REJECT
  - RULE-SET,BanProgramAD,REJECT
  - GEOSITE,category-ads-all,REJECT

  # ---- 2. 局域网与本地直连 ----
  - RULE-SET,LocalAreaNetwork,DIRECT
  - RULE-SET,UnBan,DIRECT
  - GEOSITE,private,DIRECT

  # ---- 3. 国内域名直连 (按域名命中, 不触发其他域名解析) ----
  - RULE-SET,GoogleCN,DIRECT
  - RULE-SET,ChinaDomain,DIRECT
  - RULE-SET,ChinaMedia,DIRECT
  - RULE-SET,Apple,DIRECT
  - GEOSITE,cn,DIRECT

  # ---- 4. 国内 IP 段 (强制 no-resolve, 与 iOS 版一致) ----
  - RULE-SET,ChinaCompanyIp,DIRECT,no-resolve
  - RULE-SET,ChinaIp,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve

  # ---- 5. 兜底: 其余全部走代理并在节点远端解析 (对应 FINAL,PROXY) ----
  - MATCH,PROXY
